{% extends 'base.html' %}

{% block title %}Delete Expense | Expense Tracker{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm">

            <div class="card-body p-4 text-center">

                <h3 class="fw-bold text-danger mb-3">
                    Delete Expense?
                </h3>

                <p>
                    Are you sure you want to delete:
                </p>

                <h5 class="fw-bold">
                    {{ expense.title }}
                </h5>

                <p class="text-muted">
                    ₹{{ expense.amount|floatformat:2 }}
                </p>

                <form method="POST">

                    {% csrf_token %}

                    <div class="d-flex justify-content-center gap-2">

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Yes, Delete
                        </button>

                        <a
                            href="{% url 'expense_detail' expense.pk %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
